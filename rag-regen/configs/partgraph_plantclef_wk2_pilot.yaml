# wk2 GO/NO-GO pilot dataset -- PlantCLEF2024, the 13 frozen species
# (docs/superpowers/2026-09-17-cvpr-partgraph-handoff.md, "Frozen wk2 pilot
# species list"). Each case's global_id points into the real store at
# /mnt/mmlab2024nas/ldtuan/data/partgraph/partgraph_store/plantclef/ (built by
# build_plantclef.py, Task 6). gt_refs are 2 images per species from the SAME
# candidate pool the store indexed, but explicitly EXCLUDING every image used as
# that species' medoid or any part-crop -- so scoring (metrics.dino_identity via
# metrics.split_refs, heldout_refs=1 from configs/pipeline.yaml) never grades an
# arm against the exact pixels it was conditioned on. Computed once, frozen here,
# never touched again once scoring starts (spec section 8 pre-registration).
