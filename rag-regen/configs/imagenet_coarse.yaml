# ImageNet class -> groundable superordinate. Doc 5 §5.
#
# This is the candidate pool for the `common` cohort: make_cases.py ranks
# these by LAION caption frequency and takes the top 70. A pool larger than
# the selection keeps the ranking meaningful.
#
# Three rules for every entry:
#   1. coarse != concept, or config.load_dataset:111 raises -- identical terms
#      make the fine-grained margin identically zero.
#   2. coarse must be a term GroundingDINO actually grounds. "dog" grounds;
#      "domestic animal" does not. WordNet hypernyms were rejected for this
#      reason ("teleost fishes").
#   3. the KEY must not be an English word whose dominant sense is something
#      other than the ImageNet class. corpus.caption_matches is a word-
#      boundary regex with no sense disambiguation, so frequency ranking
#      actively selects for these: retrieval returns toy kites and
#      construction cranes, the pipeline pastes one over a bird draft, and
#      DINO scores it against the ImageNet bird answer key -- reading out as
#      `harm`, the method blamed for a corpus-builder artifact.
#      corpus_density looks healthy for exactly these cases.

